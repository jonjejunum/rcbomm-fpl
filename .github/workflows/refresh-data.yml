name: Refresh league data

on:
  schedule:
    # after the weekend's games (Sun 21:00 UTC) and after Monday night football (Mon 23:00 UTC).
    # a run only commits, and so only redeploys, when the numbers actually change
    - cron: "0 21 * * 0"
    - cron: "0 23 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/fetch.py
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '23779' }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh league data"
            git push
          fi
